server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 604800
spring:
  application:
    name: yudi-cloud-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  session:
    store-type: redis
    timeout: 604800
mybatis-plus:
  configuration:
    #字段驼峰映射
    map-underscore-to-camel-case: false
    #日志仅开发
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete #全局逻辑删除的实体字段名
      logic-delete-value: 1
      logic-not-delete-value: 0
knife4j:
  enable: true
  openapi:
    title: Knife4j官方文档
    # aaa"
    version: 1.0
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.yudi.cloud.controller

# 移动端访问配置
mobile:
  # 开发环境移动端访问地址（替换localhost为实际IP）
  frontend-url: "http://localhost:5173"
  # 生产环境前端地址
  production-url: "https://yourdomain.com"